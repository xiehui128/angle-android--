name: Build ANGLE
on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * *'
    - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force build even if no new commits'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-updates:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.check.outputs.commit }}
      prev_commit: ${{ steps.check.outputs.prev_commit }}
      time: ${{ steps.check.outputs.time }}
      timestamp: ${{ steps.check.outputs.timestamp }}
    steps:
      - name: Check for new ANGLE commits
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eo pipefail
          git config --global url."https://github.com/google/".insteadOf "https://chromium.googlesource.com/"
          LATEST_COMMIT=$(git ls-remote https://chromium.googlesource.com/angle/angle.git refs/heads/main | awk '{print $1}')
          tee -a "$GITHUB_OUTPUT" << EOF
          commit=$LATEST_COMMIT
          time=$(TZ=Asia/Shanghai date "+%F %T")
          timestamp=$(date +%s)
          EOF
          PREV_COMMIT=""
          if [[ "${{ github.event.inputs.force_build }}" != "true" ]]; then
            # 容错：nightly release不存在不直接崩溃
            PREV_COMMIT=$(gh release view nightly --repo "$GITHUB_REPOSITORY" --json body -q .body 2>/dev/null | sed -n 's/^Commit: \[\(.*\)\].*/\1/p' || true)
          fi
          tee -a "$GITHUB_OUTPUT" <<< "prev_commit=$PREV_COMMIT"
          echo "LATEST_COMMIT=$LATEST_COMMIT"
          echo "PREV_COMMIT=$PREV_COMMIT"

  build-angle:
    needs: check-updates
    # force_build=true直接构建；否则仅当commit变化才构建
    if: |
      github.event.inputs.force_build == 'true' ||
      needs.check-updates.outputs.commit != needs.check-updates.outputs.prev_commit
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.package.outputs.version }}
    env:
      DEPOT_TOOLS_PATH: ${{ github.workspace }}/depot_tools
      ANGLE_ROOT: ${{ github.workspace }}/angle
      arch: arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Free disk space (aggressive)
        run: |
          set -e
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /var/lib/docker
          docker image prune -af || true
          df -h

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl python3 python3-pip openjdk-17-jdk-headless ninja-build p7zip-full

      - name: Set JDK environment
        run: |
          tee -a "$GITHUB_ENV" <<< "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64"
          tee -a "$GITHUB_PATH" <<< "/usr/lib/jvm/java-17-openjdk-amd64/bin"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Cache depot_tools
        id: cache-depot-tools
        uses: actions/cache@v6
        with:
          path: ${{ env.DEPOT_TOOLS_PATH }}
          key: depot-tools-${{ runner.os }}-${{ github.run_date }}
          restore-keys: |
            depot-tools-${{ runner.os }}-

      - name: Fetch depot_tools
        if: steps.cache-depot-tools.outputs.cache-hit != 'true'
        run: |
          set -eo pipefail
          if [ -d "$DEPOT_TOOLS_PATH" ]; then
            echo "Clean old depot_tools dir"
            rm -rf "$DEPOT_TOOLS_PATH"
          fi
          # 使用github镜像，双重重试，规避googlesource网络问题
          git clone --depth 1 https://github.com/chromium/depot_tools.git "$DEPOT_TOOLS_PATH" || \
          git clone --depth 1 https://github.com/chromium/depot_tools.git "$DEPOT_TOOLS_PATH"

      - name: Ensure depot_tools in PATH
        run: tee -a "$GITHUB_PATH" <<< "$DEPOT_TOOLS_PATH"

      - name: Configure git
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
          git config --global http.lowSpeedLimit 1000
          git config --global http.lowSpeedTime 120
          git config --global url."https://github.com/google/".insteadOf "https://chromium.googlesource.com/"

      - name: Fetch ANGLE source
        run: |
          set -eo pipefail
          mkdir -p "$ANGLE_ROOT"
          cd "$ANGLE_ROOT"
          tee .gclient << 'EOF'
          solutions = [
            {
              "name": ".",
              "url": "https://chromium.googlesource.com/angle/angle.git@refs/heads/main",
              "deps_file": "DEPS",
              "managed": False,
              "custom_deps": {},
              "custom_vars": {},
            },
          ]
          target_os = ['android']
          EOF
          # 降低并发，防止大量git请求触发429限流，双重重试
          gclient sync --no-history --jobs=2 -vvv || gclient sync --no-history --jobs=2 -vvv

      # ########### cherry‑pick补丁位置，取消注释填入你的commit hash
      # - name: Cherry‑pick Vulkan stability patches
      #   run: |
      #     set -eo pipefail
      #     cd "$ANGLE_ROOT"
      #     git fetch origin
      #     git cherry-pick HASH1
      #     git cherry-pick HASH2
      #     git cherry-pick HASH3

      - name: Generate GN build files
        run: |
          cd "$ANGLE_ROOT"
          gn gen out/Android --args='
            target_os = "android"
            target_cpu = "${{ env.arch }}"
            is_component_build = false
            is_debug = false
            arm_control_flow_integrity = "none"
            use_rtti = false
            use_thin_lto = false
            thin_lto_enable_optimizations = false
            use_lld = true
            angle_enable_vulkan = true
            angle_enable_gl = false
            angle_enable_vulkan_validation_layers = false
            angle_enable_vulkan_api_dump_layer = false
            angle_assert_always_on = false
            dcheck_always_on = false
            angle_enable_trace = false
            angle_enable_trace_events = false
            angle_enable_trace_android_logcat = false
            angle_enable_platform_trace_events = false
            angle_always_log_info = false
            angle_enable_annotator_run_time_checks = false
            angle_build_all = false
            enable_resource_allowlist_generation = false
            symbol_level = 0
            strip_debug_info = true
            use_goma = false
            use_remoteexec = false
          '
          gn check out/Android

      - name: Build ANGLE APK
        run: |
          set -eo pipefail
          pushd "$ANGLE_ROOT"
            autoninja -C out/Android angle_apks
          popd
          ls -lh "$ANGLE_ROOT/out/Android/apks/"
          mv "$ANGLE_ROOT/out/Android/apks/AngleLibraries.apk" "AngleLibraries-${{ env.arch }}.apk"
          ls -lh ./*.apk

      - name: Upload ANGLE APK
        uses: actions/upload-artifact@v7
        with:
          name: angle-apk-${{ env.arch }}
          path: AngleLibraries-${{ env.arch }}.apk
          if-no-files-found: error

      - name: Package Module
        id: package
        env:
          LATEST_COMMIT: ${{ needs.check-updates.outputs.commit }}
        run: |
          set -eo pipefail
          mkdir -p module/system/lib64
          APK_FILE="AngleLibraries-${{ env.arch }}.apk"
          # 打印apk内部结构用于调试
          7z l "$APK_FILE"
          # 硬编码arm64‑v8a路径，抛弃通配符
          7z e -omodule/system/lib64/ "$APK_FILE" \
            lib/arm64-v8a/libEGL_angle.so \
            lib/arm64-v8a/libGLESv1_CM_angle.so \
            lib/arm64-v8a/libGLESv2_angle.so
          ls -lh module/system/lib64/

          MAJOR=$(grep "ANGLE_MAJOR_VERSION" "$ANGLE_ROOT/src/common/angle_version.h" | awk '{print $3}' | head -n 1)
          MINOR=$(grep "ANGLE_MINOR_VERSION" "$ANGLE_ROOT/src/common/angle_version.h" | awk '{print $3}' | head -n 1)
          ANGLE_VERSION="(ANGLE ${MAJOR:-0}.${MINOR:-0}.1 git hash: ${LATEST_COMMIT:0:12})"
          tee -a "$GITHUB_OUTPUT" <<< "version=${ANGLE_VERSION}"

          tee -a module/module.prop << EOF
          version=${{ needs.check-updates.outputs.time }} ${ANGLE_VERSION}
          versionCode=${{ needs.check-updates.outputs.timestamp }}
          updateJson=https://github.com/${{ github.repository }}/releases/download/nightly/update-${{ env.arch }}.json
          EOF

          tee "update-${{ env.arch }}.json" << EOF
          {
            "version": "${{ needs.check-updates.outputs.time }} ${ANGLE_VERSION}",
            "versionCode": ${{ needs.check-updates.outputs.timestamp }},
            "zipUrl": "https://github.com/${{ github.repository }}/releases/download/nightly/AngleLibraries-${{ env.arch }}.zip",
            "changelog": "https://github.com/${{ github.repository }}/releases/download/nightly/version.md"
          }
          EOF

          cd module
          7z -mm=xz -mx=9 a "../AngleLibraries-${{ env.arch }}.zip" .

      - name: Upload Module Zip
        uses: actions/upload-artifact@v7
        with:
          name: angle-module-${{ env.arch }}
          path: |
            AngleLibraries-${{ env.arch }}.zip
            update-${{ env.arch }}.json
          if-no-files-found: error

  release:
    needs:
      - check-updates
      - build-angle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: angle-*
          path: assets
          merge-multiple: true

      - name: Generate version.md
        run: |
          tee assets/version.md << EOF
          - **Commit:** [${{ needs.check-updates.outputs.commit }}](https://chromium.googlesource.com/angle/angle/+log/${{ needs.check-updates.outputs.commit }})
          - **Version:** ${{ needs.check-updates.outputs.time }} ${{ needs.build-angle.outputs.version }}
          - **Timestamp:** ${{ needs.check-updates.outputs.timestamp }}
          EOF
          cat assets/version.md

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: assets/*
          tag_name: nightly
          name: Nightly Build
          body_path: assets/version.md
          overwrite_files: true
          make_latest: true
          draft: false
